openapi: 3.0.3

info:
  title: IoT Hub API
  version: "1.5.0"
  description: |
    API for managing rules with full CRUD support,
    pagination, schema versioning, and example payloads for testing.

servers:
  - url: http://localhost:3100
    description: Local development server

tags:
  - name: Rules
    description: Business logic rules and event management


paths:
  /api/rules/:
    get:
      tags:
        - Rules
      operationId: listRules
      summary: List rules with pagination and filters
      description: |
        Returns a paginated list of rules.
        Supports filtering by activation status and action type.
        Used to browse, search, and manage existing rules.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of rules to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of items to skip
        - name: is_active
          in: query
          schema:
            type: boolean
          description: Filter by enabled status
        - name: action
          in: query
          schema:
            type: object
          description: Filter by action type in JSON format
          example:
            webhook:
              url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
              enabled: true
            notification:
              channel: "email"
              enabled: true
              message: "High temperature in {device_name}: {value}°C"
      responses:
        '200':
          description: List of rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRules'
              examples:
                default:
                  summary: Paginated list of rules
                  value:
                    total: 3
                    limit: 20
                    offset: 0
                    items:
                      - id: 12
                        name: "High Temperature Alert"
                        description: "Alert when temperature exceeds 30°C"
                        is_active: true
                        condition:
                          type: "threshold"
                          operator: ">"
                          value: 30
                        action:
                          webhook:
                            url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                            enabled: true
                          notification:
                            channel: "email"
                            enabled: true
                            message: "High temperature in {device_name}: {value}°C"
                        device_metric_id: 1
                      - schema_version: 1
                        id: 32
                        name: "Low Humidity Alert"
                        description: "Alert when humidity drops below 20%"
                        is_active: true
                        condition:
                          type: "threshold"
                          operator: "<"
                          value: 20
                        action:
                          webhook:
                            url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                            enabled: true
                          notification:
                            channel: "email"
                            enabled: true
                            message: "High temperature in {device_name}: {value}°C"
                        device_metric_id: 1
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_filter:
                  summary: Invalid query parameters
                  value:
                    code: 400
                    message: "Invalid filter parameters"
    post:
      tags:
        - Rules
      operationId: createRule
      summary: Create a new rule
      description:  |
        Creates a new rule and persists it for future evaluation.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
            examples:
              threshold_rule:
                summary: Temperature threshold rule
                value:
                  schema_version: 1
                  name: "High Temperature Alert"
                  description: "Alert when temperature exceeds 30°C"
                  is_active: true
                  condition:
                    type: "threshold"
                    operator: ">"
                    value: 30
                  action:
                    webhook:
                      url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                      enabled: true
                    notification:
                      channel: "email"
                      enabled: true
                      message: "High temperature in {device_name}: {value}°C"
                  device_metric_id: 1
              rate_rule:
                summary: Event rate rule
                value:
                  schema_version: 1
                  name: "Too Many Errors"
                  description: "Alert when more than 10 errors occur in 5 minutes"
                  is_active: true
                  condition:
                    type: "rate"
                    count: 10
                    duration_minutes: 300
                  action:
                    webhook:
                      url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                      enabled: true
                    notification:
                      channel: "email"
                      enabled: true
                      message: "High temperature in {device_name}: {value}°C"
                  device_metric_id: 2
              boolean_rule:
                summary: Boolean rule
                value:
                  schema_version: 1
                  name: "Garage Motion Detected"
                  description: "Trigger on motion detection"
                  is_active: true
                  condition:
                    type: "boolean"
                    value: true
                    operator: "=="
                  action:
                    webhook:
                      url: "https://webhook.site/a1b2c3d4-0005-4a5b-8c9d-garage-motion"
                      enabled: true
                    notification:
                      channel: "sms"
                      enabled: true
                      message: "Motion detected in garage ({device_name}) at {timestamp}! Check security."
                  device_metric_id: 6
              string_match_rule:
                summary: String match rule
                value:
                  schema_version: 1
                  name: "Gateway Status Abnormal"
                  description: "Trigger when gateway status is not 'OK'"
                  is_active: true
                  condition:
                    type: "string_match"
                    value: "OK"
                    operator: "!="
                  action:
                    webhook:
                      url: "https://webhook.site/a1b2c3d4-0006-4a5b-8c9d-gw-status"
                      enabled: true
                    notification:
                      channel: "email"
                      enabled: true
                      message: "Gateway status abnormal on {device_name}: current value is '{value}'"
                  device_metric_id: 8
              composite_rule:
                summary: Composite AND rule
                value:
                  schema_version: 1
                  name: "Critical System State"
                  description: "Alert when temperature in range temperature"
                  is_active: true
                  condition:
                    type: "composite"
                    operator: "AND"
                    conditions:
                      - type: "threshold"
                        operator: "<"
                        value: 35
                      - type: "threshold"
                        operator: ">"
                        value: 20
                  action:
                    webhook:
                      url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                      enabled: true
                    notification:
                      channel: "email"
                      enabled: true
                      message: "High temperature in {device_name}: {value}°C"
                  device_metric_id: 1
      responses:
        '201':
          description: Rule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                created:
                  summary: Created rule with full schema
                  value:
                    schema_version: 1
                    id: 22
                    name: "High Temperature Alert"
                    description: "Alert when temperature exceeds 30°C"
                    is_active: true
                    condition:
                      type: "threshold"
                      operator: ">"
                      value: 30
                    action:
                      webhook:
                        url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                        enabled: true
                      notification:
                        channel: "email"
                        enabled: true
                        message: "High temperature in {device_name}: {value}°C"
                    device_metric_id: 1
        '400':
          description: Invalid rule definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_condition:
                  summary: Invalid condition definition
                  value:
                    code: 400
                    message: "Invalid rule condition: Unsupported operator"     

  /api/rules/{id}/:
    get:
      tags:
        - Rules
      operationId: getRuleById
      summary: Get rule by ID
      description: |
        Returns full rule details by its unique identifier.
        Includes condition definition, action configuration, and current state.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer  
      responses:
        '200':
          description: Rule found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                updated:
                  summary: Updated rule
                  value:
                    schema_version: 1
                    id: 31
                    name: "Updated Rule"
                    is_active: false
                    action:
                      webhook:
                        url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                        enabled: true
                      notification:
                        channel: "email"
                        enabled: true
                        message: "High temperature in {device_name}: {value}°C"
                    condition:
                      type: "threshold"
                      operator: ">"
                      value: 13
                    device_metric_id: 2  
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_payload:
                  summary: Invalid rule payload
                  value:
                    message: "Invalid rule definition"
                    code: 400   
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Rule not found
                  value:
                    message: "Rule not found"
                    code: 404
    put:
      tags:
        - Rules
      operationId: replaceRule
      summary: Replace rule completely
      description: |
        Replaces the entire rule definition.
        All rule fields must be provided in the request body.
        Missing fields will be overwritten with new values.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
            examples:
              update_example:
                summary: Update rule example
                value:
                  schema_version: 1
                  name: "Updated Rule"
                  description: "Changed description"
                  is_active: false
                  condition:
                    type: "threshold"
                    operator: ">"
                    value: 13
                  action:
                    webhook:
                      url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                      enabled: true
                    notification:
                      channel: "email"
                      enabled: true
                      message: "High temperature in {device_name}: {value}°C"
                  device_metric_id: 2
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                updated:
                  summary: Updated rule
                  value:
                    schema_version: 1
                    id: 44
                    name: "Updated Rule"
                    is_active: false
                    action:
                      webhook:
                        url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                        enabled: true
                      notification:
                        channel: "email"
                        enabled: true
                        message: "High temperature in {device_name}: {value}°C"
                    condition:
                      type: "threshold"
                      operator: ">"
                      value: 13
                    device_metric_id: 1   
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_payload:
                  summary: Invalid rule payload
                  value:
                    message: "Invalid rule definition"
                    code: 400
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Rule not found
                  value:
                    message: "Rule not found"
                    code: 404
    patch:
      tags:
        - Rules
      summary: Partially update rule
      description: |
        Updates one or more fields of an existing rule.
        Only provided fields are modified; all others remain unchanged.
      operationId: patchRule
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePatch'
            examples:
              replace_rule:
                summary: Full rule replacement
                value:
                  schema_version: 1
                  name: "Updated Rule"
                  is_active: false
                  condition:
                    type: "threshold"
                    operator: "<"
                    value: 10
                  device_metric_id: 1
                  action:
                    webhook:
                      url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                      enabled: true
                    notification:
                      channel: "email"
                      enabled: true
                      message: "High temperature in {device_name}: {value}°C"
  
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleUpdateResponse'
              examples:
                updated:
                  summary: Updated rule
                  value:
                    status: 200
                    rule_id: 1  
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_payload:
                  summary: Invalid rule payload
                  value:
                    message: "Invalid rule definition"
                    code: 400
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Rule not found
                  value:
                    message: "Rule not found"
                    code: 404
    delete:
      tags:
        - Rules
      summary: Delete rule
      description: |
        Permanently deletes a rule.
        Deleted rules are no longer evaluated and cannot be restored.
      operationId: deleteRule
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Rule deleted
          content:
            application/json:
              examples:
                no_content:
                  summary: No response body
                  value: {}
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Rule does not exist
                  value:
                    code: 404
                    message: "Rule not found"

  /api/rules/evaluate/:
    post:
      tags:
        - Rules
      summary: Manually trigger rule evaluation
      operationId: evaluateRules
      description: |
        Triggers manual evaluation of all enabled rules for debugging and demo purposes.
        This endpoint runs the rule processor immediately instead of waiting for the scheduled task.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleEvaluateRequest'
            examples:
              evaluate_example:
                summary: Evaluate telemetry data against rules
                value:
                  device_id: 9
      responses:
        '200':
          description: Evaluation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/RuleEvaluationResult'
              example:
                status: 200
                results:
                  - telemetry_id: 2
                    device_metric_id: 1
                    device_name: "device 1"
                    result:
                      telemetry_id: 2
                      results:
                        - rule_id: 1
                          triggered: true
                        - rule_id: 4
                          triggered: true        
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  summary: Invalid telemetry payload
                  value:
                    code: 400
                    message: "Telemetry value missing"



components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token containing claims:
        - sub: authenticated user id
        - scope: granted permissions (e.g., devices:read)
        - role: user | admin
        - exp: expiration timestamp
  
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      example:
        code: 404
        message: "Resource not found"

    Rule:
      type: object
      description: Business logic rule for monitoring and alerting
      properties:
        id:
          type: integer
          example: 111
        name:
          type: string
          example: "High Temperature Alert"
        description:
          type: string
          example: "Alert when temperature exceeds 30°C"
        is_active:
          type: boolean
          example: true
        condition:
          description: Rule condition in JSON format (see docs/rules.md for full schema)
          oneOf:
            - $ref: '#/components/schemas/RuleConditionThreshold'
            - $ref: '#/components/schemas/RuleConditionRate'
            - $ref: '#/components/schemas/RuleConditionStringMatch'
            - $ref: '#/components/schemas/RuleConditionBoolean'
            - $ref: '#/components/schemas/RuleConditionComposite'
          example:
            type: "threshold"
            operator: ">"
            value: 30
        action:
          type: object
          description: Rule action in JSON format (see docs/rules.md for full schema)
          example:
            webhook:
              url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
              enabled: true
            notification:
              channel: "email"
              enabled: true
              message: "High temperature in {device_name}: {value}°C"
        device_metric_id:
          type: integer
          description: Foreign key to DeviceMetric model
          example: 333 
      required:
        - id
        - name
        - is_active
        - condition
        - action
        - device_metric_id
      example:
        id: 1
        name: "High Temperature Alert"
        description: "Alert when temperature exceeds 30°C"
        is_active: true
        condition:
          type: "threshold"
          operator: ">"
          value: 30
        action:
          webhook:
            url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
            enabled: true
          notification:
            channel: "email"
            enabled: true
            message: "High temperature in {device_name}: {value}°C"
        device_metric_id: 1

    RuleCreate:
      type: object
      description: Data required to create a new rule
      properties:
        schema_version:
          type: integer
          description: Version of the rule schema definition
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "High Temperature Alert"
        description:
          type: string
          maxLength: 1000
          example: "Alert when temperature exceeds 30°C"
        is_active:
          type: boolean
          default: true
          example: true
        condition:
          description: |
            Rule condition structure. Supported types:
            - threshold: Compare metric to value
            - rate: Count events in time window
            - composite: Combine multiple conditions with AND/OR
          oneOf:
            - $ref: '#/components/schemas/RuleConditionThreshold'
            - $ref: '#/components/schemas/RuleConditionRate'
            - $ref: '#/components/schemas/RuleConditionStringMatch'
            - $ref: '#/components/schemas/RuleConditionBoolean'
            - $ref: '#/components/schemas/RuleConditionComposite'
          example:
            type: "threshold"
            operator: ">"
            value: 30
        action:
          type: object
          description: Rule action in JSON format (see docs/rules.md for full schema)
          example:
            webhook:
              url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
              enabled: true
            notification:
              channel: "email"
              enabled: true
              message: "High temperature in {device_name}: {value}°C"
        device_metric_id:
          type: integer
          description: Foreign key to DeviceMetric model
          example: 1
      required:
        - name
        - condition
        - is_active
        - action
        - device_metric_id
        - schema_version
      example:
        schema_version: 1
        name: "High Temperature Alert"
        description: "Alert when temperature exceeds 30°C"
        is_active: true
        condition:
          type: "threshold"
          operator: ">"
          value: 30
        action:
          webhook:
            url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
            enabled: true
          notification:
            channel: "email"
            enabled: true
            message: "High temperature in {device_name}: {value}°C"
        device_metric_id: 1       

    RulePatch:
      type: object
      description: Partial update of rule fields
      properties:
        schema_version:
          type: integer
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        condition:
          type: object
        action:
          type: object
      example:
        is_active: false

    RuleConditionThreshold:
      type: object
      description: Threshold-based rule condition
      properties:
        type:
          type: string
          enum: [threshold]
          example: "threshold"
        operator:
          type: string
          enum: [">", ">=", "<", "<=", "==", "!="]
          example: ">"
        value:
          type: number
          example: 30
      required:
        - type
        - operator
        - value
      example:
        type: "threshold"
        operator: ">"
        value: 30

    RuleConditionRate:
      type: object
      description: Rate-based rule condition (event frequency)
      properties:
        type:
          type: string
          enum: [rate]
          example: "rate"
        count:
          type: integer
          minimum: 1
          description: Number of events threshold
          example: 10
        duration_minutes:
          type: integer
          minimum: 1
          description: Time window in seconds
          example: 300
      required:
        - type
        - count
        - duration_minutes
      example:
        type: "rate"
        count: 10
        duration_minutes: 300

    RuleConditionBoolean:
      type: object
      description: Boolean rule condition (true/false check)
      properties:
        type:
          type: string
          enum: [boolean]
          example: "boolean"
        value:
          type: boolean
          description: Expected boolean value
          example: true
        operator:
          type: string
          enum: ["==", "!="]
          description: Comparison operator
          example: "=="
      required:
        - type
        - value
        - operator
      example:
        type: "boolean"
        value: true
        operator: "=="

    RuleConditionStringMatch:
      type: object
      description: String match rule condition
      properties:
        type:
          type: string
          enum: [string_match]
          example: "string_match"
        value:
          type: string
          description: Expected string to compare
          example: "OK"
        operator:
          type: string
          enum: ["==", "!=", "in"]
          description: Comparison operator
          example: "!="
      required:
        - type
        - value
        - operator
      example:
        type: "string_match"
        value: "OK"
        operator: "!="

    RuleConditionComposite:
      type: object
      description: Composite rule combining multiple conditions
      properties:
        type:
          type: string
          enum: [composite]
          example: "composite"
        operator:
          type: string
          enum: [AND, OR]
          example: "AND"
        conditions:
          type: array
          description: Array of sub-conditions (threshold or rate)
          items:
            oneOf:
              - $ref: '#/components/schemas/RuleConditionThreshold'
              - $ref: '#/components/schemas/RuleConditionRate'
              - $ref: '#/components/schemas/RuleConditionStringMatch'
              - $ref: '#/components/schemas/RuleConditionBoolean'
          minItems: 2
      required:
        - type
        - operator
        - conditions
      example:
        type: "composite"
        operator: "AND"
        conditions:
          - type: "threshold"
            operator: ">"
            value: 35
          - type: "rate"
            count: 5
            duration_minutes: 20

    PaginatedRules:
      type: object
      properties:
        total:
          type: integer
          example: 25
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
      required:
        - total
        - limit
        - offset
        - items
      example:
        total: 25
        limit: 20
        offset: 0
        items:
          - id: 1
            name: "High Temperature Alert"
            description: "Alert when temperature exceeds 30°C"
            is_active: true
            condition:
              type: "threshold"
              operator: ">"
              value: 30
            action:
              webhook:
                url: "https://webhook.site/a6bf3275-595d-42fd-b759-c42d74ce8c9e"
                enabled: true
              notification:
                channel: "email"
                enabled: true
                message: "High temperature in {device_name}: {value}°C"
            device_metric_id: 1
    
    RuleUpdateResponse:
      type: object
      properties:
        status:
          type: integer
        rule_id:
          type: integer
      required:
        - status
        - rule_id
      example:
        status: 200
        rule_id: 1  

    RuleEvaluateRequest:
      type: object
      properties:
        rule_id:
          type: integer
          description: Optional - evaluate only this specific rule
        device_id:
          type: integer
          description: Optional - evaluate rules only for this device
      example:
        rule_id: 12
        device_id: 5

    RuleEvaluationResult:
      type: object
      properties:
        telemetry_id:
          type: integer
          example: 101
        device_metric_id:
          type: integer
          example: 5
        device_name:
          type: string
          example: "Temperature Sensor"
        result:
          $ref: '#/components/schemas/RuleProcessorOutput'
      example:
        telemetry_id: 2
        device_metric_id: 1
        device_name: "device 1"
        result:
          telemetry_id: 2
          results:
            - rule_id: 1
              triggered: true

    RuleProcessorOutput:
      type: object
      properties:
        telemetry_id:
          type: integer
          example: 2
        results:
          type: array
          items:
            $ref: '#/components/schemas/IndividualRuleResult'
      example:
        telemetry_id: 2
        results:
          - rule_id: 1
            triggered: true      

    IndividualRuleResult:
      type: object
      properties:
        rule_id:
          type: integer
          example: 1
        triggered:
          type: boolean
          example: true
      example:
        rule_id: 1
        triggered: true   
