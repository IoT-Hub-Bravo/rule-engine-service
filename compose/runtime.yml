name: ${COMPOSE_PROJECT_NAME:-rule-engine-service}

services:
  rule-engine:
    env_file:
    - ../.env
    build:
      context: .. 
      dockerfile: docker/django/Dockerfile
    command: /start-web-dev.sh

    volumes:
      - ../src:/app

    ports:
      - "8000:8000"
    environment:
      DEBUG: True
      SECRET_KEY: "dev-secret-key"

    networks:
      - iot-hub-nw  


networks:
  iot-hub-nw:
    external: true
