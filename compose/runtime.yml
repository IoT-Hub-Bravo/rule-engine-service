name: ${COMPOSE_PROJECT_NAME:-rule-engine-service}

x-django-base: &django_base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file:
    - ../.env
  restart: unless-stopped
  networks:
    - iot-hub-nw

services:
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    restart: always
    ports:
      - "3200:8080"
    environment:
      SWAGGER_JSON: /docs/api.yaml
    volumes:
      - ../docs:/docs


  rule-engine:
    <<: *django_base
    container_name: rule-engine
    ports:
      - "3100:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *django_base
    container_name: worker
    command:
      [
        "celery",
        "-A",
        "config.celery_app",
        "worker",
        "-l",
        "INFO",
        "--concurrency=${CELERY_CONCURRENCY:-2}",
      ]


  kafka-rule-engine:
    <<: *django_base
    container_name: kafka-rule-engine
    command: ["python", "-m", "apps.rules.consumers.rule_engine"]
    environment:
      KAFKA_GROUP_ID: rule-engine


networks:
  iot-hub-nw:
    external: true
